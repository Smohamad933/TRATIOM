<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>پنل مدیریت تراریوم</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="/admin/"><span class="brand-logo">🌱</span><span>مدیریت تراریوم</span></a>
      <div class="row gap-sm">
        <a class="btn ghost sm" href="/" target="_blank" rel="noopener">مشاهده فروشگاه</a>
        <span id="admin-user"></span>
      </div>
    </div>
  </header>

  <!-- Login -->
  <div id="login-view" class="center-page hidden" style="min-height:calc(100vh - 64px)">
    <div class="card narrow">
      <h2>ورود مدیر</h2>
      <p class="muted">با شماره موبایلی که در <code>ADMIN_MOBILES</code> تعریف شده وارد شوید.</p>
      <form id="lg-mobile" class="stack">
        <input type="tel" name="mobile" class="ltr" style="width:100%" placeholder="09121234567" required>
        <button class="btn primary block">دریافت کد</button>
      </form>
      <form id="lg-code" class="stack hidden">
        <div id="lg-dev"></div>
        <input type="text" name="code" class="otp-input" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required>
        <button class="btn primary block">ورود</button>
      </form>
      <div id="lg-error" class="mt"></div>
    </div>
  </div>

  <!-- App -->
  <div id="app-view" class="container hidden">
    <div class="admin-shell">
      <nav class="side-nav" id="nav">
        <button data-tab="dashboard" class="active">📊 داشبورد</button>
        <button data-tab="orders">📦 سفارش‌ها</button>
        <button data-tab="catalog">💰 قیمت و موجودی</button>
        <button data-tab="rules">🛡️ قوانین سازگاری</button>
        <button data-tab="system">🖥️ وضعیت سیستم</button>
      </nav>
      <main id="content"></main>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
